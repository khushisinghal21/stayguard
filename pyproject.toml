[project]
name = "stayguard"
version = "1.1.0"
description = "Stops reservation-hijack scams sent from compromised hotel accounts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Loose ranges: what the code needs. The exact, tested versions are pinned in requirements.lock.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "tldextract>=5.1",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.7", "matplotlib>=3.8", "pandas-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stayguard"]

[tool.setuptools.package-data]
stayguard = ["static/*", "static/fonts/*"]

# ------------------------------------------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["data", "models", "docs/baselines"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM", "PERF"]
ignore = [
  "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts, fixed test secrets and non-crypto randomness are fine in tests
"eval/**" = ["S311"]                           # seeded random sampling for reproducible evaluation
"scripts/**" = ["S311"]
"tests/adversarial/corpus.py" = ["E501"]       # attack strings are kept verbatim on one line so they are easy to read and diff

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------------------------------------------------------- mypy
[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# The decision path is strict. Path to strict everywhere: classifier, session_risk, db, api next (they are typed
# but still pass Any-typed pandas/sklearn objects around), then eval/ and scripts/.
[[tool.mypy.overrides]]
module = ["stayguard.engine", "stayguard.signals", "stayguard.links", "stayguard.judges", "stayguard.service",
          "stayguard.domains", "stayguard.artifacts", "stayguard.config"]
strict = true

# ------------------------------------------------------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["stayguard"]
omit = ["stayguard/maintenance.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
